services:
  redis:
    image: redis:7-alpine
    container_name: feh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - feh-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feh-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=feh-jwt-secret-key-recife-2026
      - CORS_ORIGIN=*
      - CRON_SCHEDULE=30 5 * * *
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=adminrecife
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - feh-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feh-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - feh-network

volumes:
  redis-data:

networks:
  feh-network:
    driver: bridge
